<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 16px;
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      background: #111827;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .display-container {
      background: #1f2937;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 18px;
      text-align: right;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .history {
      color: #9ca3af;
      font-size: 0.95rem;
      min-height: 22px;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .display {
      color: #f9fafb;
      font-size: 2.3rem;
      font-weight: 600;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .display::-webkit-scrollbar {
      display: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 62px;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      background: #1f2937;
      color: #f9fafb;
      transition: transform 0.1s ease, background 0.15s ease;
      user-select: none;
    }

    button:hover {
      background: #374151;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-clear {
      background: #7f1d1d;
      color: #fecaca;
    }

    .btn-clear:hover {
      background: #991b1b;
    }

    .btn-action {
      background: #334155;
      color: #cbd5e1;
    }

    .btn-action:hover {
      background: #475569;
    }

    .btn-operator {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #1d4ed8;
    }

    .btn-equal {
      background: #10b981;
      color: #ffffff;
    }

    .btn-equal:hover {
      background: #059669;
    }

    .span-two {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display-container">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </div>

    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-action" onclick="deleteLast()">DEL</button>
      <button class="btn-action" onclick="appendOperator('%')">%</button>
      <button class="btn-operator" onclick="appendOperator('÷')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="btn-operator" onclick="appendOperator('×')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="btn-operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="btn-operator" onclick="appendOperator('+')">+</button>

      <button class="span-two" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const historyEl = document.getElementById('history');

    let currentInput = '0';
    let justCalculated = false;

    function updateDisplay() {
      display.textContent = currentInput;
      display.scrollLeft = display.scrollWidth;
    }

    function appendNumber(num) {
      if (currentInput === 'Error') {
        currentInput = '0';
      }

      if (justCalculated) {
        currentInput = num === '.' ? '0.' : num;
        justCalculated = false;
        updateDisplay();
        return;
      }

      const lastChar = currentInput.slice(-1);
      if (lastChar === '%') {
        currentInput += '×';
      }

      if (num === '.') {
        const parts = currentInput.split(/[+\-×÷%]/);
        const lastPart = parts[parts.length - 1];
        if (lastPart.includes('.')) return;
        currentInput += lastPart === '' ? '0.' : '.';
      } else {
        if (currentInput === '0') {
          currentInput = num;
        } else {
          const parts = currentInput.split(/([+\-×÷%])/);
          if (parts[parts.length - 1] === '0') {
            parts[parts.length - 1] = num;
            currentInput = parts.join('');
          } else {
            currentInput += num;
          }
        }
      }

      updateDisplay();
    }

    function appendOperator(op) {
      if (currentInput === 'Error') {
        currentInput = '0';
      }

      justCalculated = false;
      const operators = ['+', '-', '×', '÷'];
      const lastChar = currentInput.slice(-1);

      if (op === '%') {
        if (operators.includes(lastChar) || lastChar === '%' || lastChar === '.') return;
        currentInput += '%';
        updateDisplay();
        return;
      }

      if (operators.includes(lastChar) || lastChar === '.') {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }

      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      historyEl.textContent = '';
      justCalculated = false;
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput === 'Error') {
        clearAll();
        return;
      }
      justCalculated = false;
      if (currentInput.length <= 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      if (currentInput === 'Error') return;

      let expr = currentInput;
      while (['+', '-', '×', '÷', '.'].includes(expr.slice(-1))) {
        expr = expr.slice(0, -1);
      }
      if (!expr) return;

      historyEl.textContent = expr + ' =';

      const jsExpr = expr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/%/g, '/100');

      if (!/^[0-9+\-*/.() ]+$/.test(jsExpr)) {
        currentInput = 'Error';
        updateDisplay();
        return;
      }

      try {
        const result = Function('"use strict"; return (' + jsExpr + ')')();
        if (!isFinite(result) || isNaN(result)) {
          currentInput = 'Error';
        } else {
          currentInput = String(Number(result.toPrecision(12)));
        }
      } catch (e) {
        currentInput = 'Error';
      }

      justCalculated = true;
      updateDisplay();
    }

    // Keyboard Support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.') appendNumber('.');
      else if (e.key === '+') appendOperator('+');
      else if (e.key === '-') appendOperator('-');
      else if (e.key === '*') appendOperator('×');
      else if (e.key === '/') {
        e.preventDefault();
        appendOperator('÷');
      } else if (e.key === '%') appendOperator('%');
      else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate();
      } else if (e.key === 'Backspace') deleteLast();
      else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
    });
  </script>
</body>
</html>
